name: LocalVoiceKeyboard
options:
  bundleIdPrefix: com.example.localvoicekeyboard
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

packages:
  VoiceKeyboardCore:
    path: .
  TranscribeCpp:
    path: .build/Parakeet/SwiftPackage

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  LocalVoiceKeyboard:
    type: application
    platform: iOS
    sources:
      - Sources/App
      - Sources/Shared
    dependencies:
      - package: VoiceKeyboardCore
        product: VoiceKeyboardCore
      - package: TranscribeCpp
        product: TranscribeCpp
      - target: LocalVoiceKeyboardExtension
        embed: true
      - target: SaywickShare
        embed: true
      - target: SaywickStatus
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SAYWICK_APP"
        CODE_SIGN_ENTITLEMENTS: Config/LocalVoiceKeyboard.entitlements
    info:
      path: Config/LocalVoiceKeyboard-Info.plist
      properties:
        AppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        CFBundleDisplayName: Saywick
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: localvoicekeyboard
            CFBundleURLSchemes:
              - localvoicekeyboard
              - saywick
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Audio recording
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.audio
        NSMicrophoneUsageDescription: Record dictation for on-device transcription with Parakeet. Audio is never sent to a transcription service.
        UIApplicationSupportsIndirectInputEvents: true
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: Config/LocalVoiceKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
        com.apple.BackgroundModes:
          enabled: 1

  LocalVoiceKeyboardExtension:
    type: app-extension
    platform: iOS
    productName: LocalVoice
    sources:
      - Sources/KeyboardExtension
      - Sources/Shared
    dependencies:
      - package: VoiceKeyboardCore
        product: VoiceKeyboardCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app.keyboard
        CODE_SIGN_ENTITLEMENTS: Config/KeyboardExtension.entitlements
        SKIP_INSTALL: true
    info:
      path: Config/KeyboardExtension-Info.plist
      properties:
        AppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        CFBundleDisplayName: Saywick
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    entitlements:
      path: Config/KeyboardExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1

  SaywickShare:
    type: app-extension
    platform: iOS
    sources:
      - Sources/ShareExtension
      - Sources/Shared/SharedAudioInbox.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app.share
        CODE_SIGN_ENTITLEMENTS: Config/ShareExtension.entitlements
    info:
      path: Config/ShareExtension-Info.plist
      properties:
        CFBundleDisplayName: Saywick
        AppGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: 'SUBQUERY(extensionItems, $item, SUBQUERY($item.attachments, $attachment, ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.audio").@count > 0).@count > 0'
    entitlements:
      path: Config/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_IDENTIFIER)

  SaywickStatus:
    type: app-extension
    platform: iOS
    sources:
      - Sources/StatusWidget
      - Sources/Shared/SaywickActivityAttributes.swift
      - Sources/Shared/StopSaywickRecording.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app.status
    info:
      path: Config/StatusWidget-Info.plist
      properties:
        CFBundleDisplayName: Saywick Status
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  SaywickAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/SaywickAppTests
      - Sources/KeyboardExtension/KeyboardViewController.swift
      - Sources/Shared/SharedContainerStore.swift
    dependencies:
      - target: LocalVoiceKeyboard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app.tests

  LocalVoiceKeyboardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/LocalVoiceKeyboardUITests
    dependencies:
      - target: LocalVoiceKeyboard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app.uitests
        TEST_TARGET_NAME: LocalVoiceKeyboard

schemes:
  LocalVoiceKeyboard:
    build:
      targets:
        LocalVoiceKeyboard: all
        LocalVoiceKeyboardExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LocalVoiceKeyboardUITests
        - SaywickAppTests
    archive:
      config: Release
